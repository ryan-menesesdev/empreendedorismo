<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Editar Aluno</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: #f9fafb; color: #333; }
  aside { width: 220px; background: white; border-right: 1px solid #eee; padding: 20px 0; }
  .logo { padding: 0 20px 20px; font-weight: bold; }
  .menu a { display: block; padding: 12px 20px; color: #555; text-decoration: none; font-size: 14px; margin: 5px 10px; border-radius: 8px; }
  .menu a.active { background: #f3f4f6; color: #4f46e5; font-weight: bold; }
  main { flex: 1; padding: 30px; overflow-y: auto; max-width: 800px;}
  .card { background: white; padding: 25px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 20px; }
  .form-group { margin-bottom: 15px; display: inline-block; width: 48%; }
  label { display: block; font-size: 12px; font-weight: bold; color: #666; margin-bottom: 5px; }
  input { width: 90%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
  .footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn { padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 14px; border: 1px solid #ddd; cursor: pointer; }
  .btn-primary { background: #4f46e5; color: white; border: none; }
</style>
</head>
<body>
  <aside>
    <div class="logo">🎓 Permanência</div>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="alunos.html" class="active">Alunos</a>
      <a href="alertas.html">Alertas <span style="float:right; background:#fee2e2; color:#dc2626; padding:2px 6px; border-radius:10px; font-size:10px;">5</span></a>
      <a href="adicionar-aluno.html">Cadastro</a>
      <a href="landing-page.html">Landing Page</a>
    </div>
  </aside>
  <main>
    <a href="perfil-aluno.html" style="color: #666; text-decoration: none; font-size: 14px;">← Voltar para o perfil</a>
    <h1 style="margin: 20px 0 30px;">Editar aluno</h1>
    
    <div class="card">
      <h3 style="margin-top:0; font-size:16px;">01 Dados do aluno</h3>
      <div class="form-group"><label>Nome completo</label><input id="nome" type="text"></div>
      <div class="form-group"><label>Matrícula</label><input id="matricula" type="text" disabled></div>
      <div class="form-group"><label>Turma</label><input id="turma" type="text"></div>
    </div>
    
    <div class="card">
      <h3 style="margin-top:0; font-size:16px;">02 Registro atual</h3>
      <div class="form-group"><label>Faltas no período</label><input id="faltas" type="number"></div>
      <div class="form-group"><label>Média geral</label><input id="media" type="text"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0; font-size:16px;">03 Notas por disciplina</h3>
      <div class="form-group"><label>Português</label><input class="nota-input" data-disciplina="Português" type="text" placeholder="0,0"></div>
      <div class="form-group"><label>Matemática</label><input class="nota-input" data-disciplina="Matemática" type="text" placeholder="0,0"></div>
      <div class="form-group"><label>Ciências</label><input class="nota-input" data-disciplina="Ciências" type="text" placeholder="0,0"></div>
      <div class="form-group"><label>História</label><input class="nota-input" data-disciplina="História" type="text" placeholder="0,0"></div>
      <div class="form-group"><label>Geografia</label><input class="nota-input" data-disciplina="Geografia" type="text" placeholder="0,0"></div>
    </div>

    <div class="footer">
      <a href="perfil-aluno.html" class="btn">Cancelar</a>
      <a href="perfil-aluno.html" class="btn btn-primary">Salvar alterações</a>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const alunoId = params.get('id') || 1;

    async function carregarDados() {
      const res = await fetch(`/api/alunos/${alunoId}`);
      const { aluno, notas } = await res.json();

      document.getElementById('nome').value = aluno.nome_completo;
      document.getElementById('matricula').value = aluno.matricula;
      document.getElementById('turma').value = aluno.turma;
      document.getElementById('faltas').value = aluno.faltas_periodo;
      document.getElementById('media').value = Number(aluno.media_geral).toFixed(1).replace('.', ',');

      document.querySelectorAll('.nota-input').forEach(input => {
        const disc = input.dataset.disciplina;
        const encontrada = notas.find(n => n.disciplina.toLowerCase() === disc.toLowerCase());
        if (encontrada) {
          input.value = Number(encontrada.nota).toFixed(1).replace('.', ',');
        }
      });

      document.querySelectorAll('a[href="perfil-aluno.html"]').forEach(a => a.href = `perfil-aluno.html?id=${alunoId}`);
    }

    document.querySelector('.btn-primary').addEventListener('click', async (e) => {
      e.preventDefault();
      const notasPayload = [];
      document.querySelectorAll('.nota-input').forEach(input => {
        if (input.value.trim() !== '') {
          notasPayload.push({
            disciplina: input.dataset.disciplina,
            nota: input.value.trim()
          });
        }
      });

      const res = await fetch(`/api/alunos/${alunoId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome_completo: document.getElementById('nome').value,
          turma: document.getElementById('turma').value,
          faltas_periodo: document.getElementById('faltas').value,
          media_geral: document.getElementById('media').value,
          notas: notasPayload
        })
      });

      if (res.ok) {
        alert('Aluno atualizado com sucesso!');
        window.location.href = `perfil-aluno.html?id=${alunoId}`;
      } else {
        alert('Erro ao salvar alterações.');
      }
    });

    carregarDados();
  </script>
</body>
</html>
