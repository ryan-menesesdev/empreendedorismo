<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Adicionar Aluno</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: #f9fafb; color: #333; }
  aside { width: 220px; background: white; border-right: 1px solid #eee; padding: 20px 0; }
  .logo { padding: 0 20px 20px; font-weight: bold; }
  .menu a { display: block; padding: 12px 20px; color: #555; text-decoration: none; font-size: 14px; margin: 5px 10px; border-radius: 8px; }
  .menu a.active { background: #f3f4f6; color: #4f46e5; font-weight: bold; }
  main { flex: 1; padding: 30px; overflow-y: auto; max-width: 800px;}
  .card { background: white; padding: 25px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 20px; }
  .form-group { margin-bottom: 15px; display: inline-block; width: 48%; }
  label { display: block; font-size: 12px; font-weight: bold; color: #666; margin-bottom: 5px; }
  input, select { width: 90%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; background: white; }
  .footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn { padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 14px; border: 1px solid #ddd; cursor: pointer; }
  .btn-primary { background: #4f46e5; color: white; border: none; }
</style>
</head>
<body>
  <aside>
    <div class="logo">🎓 Permanência</div>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="alunos.html">Alunos</a>
      <a href="alertas.html">Alertas <span style="float:right; background:#fee2e2; color:#dc2626; padding:2px 6px; border-radius:10px; font-size:10px;">5</span></a>
      <a href="adicionar-aluno.html" class="active">Cadastro</a>
      <a href="landing-page.html">Landing Page</a>
    </div>
  </aside>
  <main>
    <a href="alunos.html" style="color: #666; text-decoration: none; font-size: 14px;">← Voltar para alunos</a>
    <h1 style="margin: 20px 0 30px;">Adicionar aluno</h1>
    
    <div class="card">
      <h3 style="margin-top:0; font-size:16px;">01 Dados do aluno</h3>
      <div class="form-group" style="width: 98%;"><label>Nome completo</label><input id="nome" type="text" placeholder="Ex.: Mariana Silva Pereira" style="width:95%"></div>
      <div class="form-group"><label>Data de nascimento</label><input id="nascimento" type="date"></div>
      <div class="form-group"><label>Matrícula</label><input id="matricula" type="text" placeholder="2025-0000"></div>
      <div class="form-group">
        <label>Turma</label>
        <select id="turma">
          <option value="">Selecione a turma</option>
          <option value="7º A">7º A</option>
          <option value="7º B">7º B</option>
          <option value="8º A">8º A</option>
          <option value="8º B">8º B</option>
          <option value="9º A">9º A</option>
          <option value="9º B">9º B</option>
        </select>
      </div>
    </div>
    
    <div class="card">
      <h3 style="margin-top:0; font-size:16px;">02 Registro inicial</h3>
      <div class="form-group"><label>Faltas no período</label><input id="faltas" type="number" placeholder="0"></div>
      <div class="form-group"><label>Média geral</label><input id="media" type="text" placeholder="0,0"></div>
    </div>

    <div class="footer">
      <a href="alunos.html" class="btn">Cancelar</a>
      <a href="alunos.html" class="btn btn-primary">+ Adicionar aluno</a>
    </div>
  </main>
  <script>
    document.querySelector('.btn-primary').addEventListener('click', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const nascimento = document.getElementById('nascimento').value;
      const matricula = document.getElementById('matricula').value.trim();
      const turma = document.getElementById('turma').value;
      const faltas = document.getElementById('faltas').value;
      const media = document.getElementById('media').value;

      if (!nome || !matricula || !turma) {
        return alert('Preencha Nome completo, Matrícula e Turma.');
      }

      const res = await fetch('/api/alunos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome_completo: nome,
          data_nascimento: nascimento,
          matricula: matricula,
          turma: turma,
          faltas_periodo: faltas,
          media_geral: media
        })
      });

      if (res.ok) {
        alert('Aluno cadastrado com sucesso!');
        window.location.href = 'alunos.html';
      } else {
        const err = await res.json();
        alert(err.error || 'Erro ao cadastrar aluno.');
      }
    });
  </script>
</body>
</html>
